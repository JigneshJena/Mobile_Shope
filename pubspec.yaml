name: s_p_mobile
description: "Mobile Repair Shop Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Network
  http: ^1.3.0

  # Excel export & sharing
  excel: ^4.0.6
  share_plus: ^10.1.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5

  # UI
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

  # Encryption (Task 4 — AES-256 IMEI storage)
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
